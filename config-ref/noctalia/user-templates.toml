# User-defined templates
# Add your custom templates below
# Example:
# [theme.templates.user.myapp]
# input_path = "~/.config/noctalia/templates/myapp.css"
# output_path = "~/.config/myapp/theme.css"
# post_hook = "myapp --reload-theme"

[theme.templates.user.nvim-base16]
input_path = "~/.config/nvim/lua/matugen-template.lua"
output_path = "~/.config/nvim/lua/matugen.lua"
post_hook = 'pkill -SIGUSR1 nvim'

[theme.templates.user.gcsd]
input_path = "~/.local/share/feathers-and-flame/templates/gcsd/System-Template.gctheme"
output_path = "~/.local/share/feathers-and-flame/script/helpers/tempfiles/gcsd/System.gctheme"
post_hook = 'bash ~/.local/share/feathers-and-flame/script/cmd/gcsd-process.sh'

[theme.templates.user.qt5ct]
input_path = "~/.local/share/feathers-and-flame/templates/qt/qtct.conf"
output_path = "~/.config/qt5ct/colors/noctalia.conf"

[theme.templates.user.qt6ct]
input_path = "~/.local/share/feathers-and-flame/templates/qt/qtct.conf"
output_path = "~/.config/qt6ct/colors/noctalia.conf"

[theme.templates.user.gum]
input_path = "~/.local/share/feathers-and-flame/templates/gum/gum-theme.kdl"
output_path = "~/.local/share/feathers-and-flame/script/helpers/state/gum/gum-theme.kdl"

[theme.templates.user.sddm]
input_path = "~/.local/share/feathers-and-flame/templates/sddm/theme.template.conf"
output_path = "~/.local/share/feathers-and-flame/script/helpers/tempfiles/sddm-theme.conf"
post_hook = "bash ~/.local/share/feathers-and-flame/script/cmd/sddm-process.sh"
